name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python
        run: uv python install 3.12

      - name: Sync deps
        run: uv sync --frozen --extra dev

      - name: Unit tests
        run: uv run pytest -q

      - name: Eval smoke (no LLM)
        run: uv run python scripts/run_evals.py
